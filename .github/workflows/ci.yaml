name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions: {}

env:
  TYPST_TARGET_FILES: main.typ # Space-separated list of Typst entrypoint files

jobs:
  determine-changes:
    name: Determine changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      github-actions: ${{ steps.changed-files.outputs.github_actions_any_changed }}
      github-actions-ci: ${{ steps.changed-files.outputs.github_actions_ci_any_changed }}
      pre-commit-config: ${{ steps.changed-files.outputs.pre_commit_config_any_changed }}
      renovate-config: ${{ steps.changed-files.outputs.renovate_config_any_changed }}
      md: ${{ steps.changed-files.outputs.md_any_changed }}
      json5: ${{ steps.changed-files.outputs.json5_any_changed }}
      json5-files: ${{ steps.changed-files.outputs.json5_all_changed_files }}
      toml: ${{ steps.changed-files.outputs.toml_any_changed }}
      yaml: ${{ steps.changed-files.outputs.yaml_any_changed }}
      typst: ${{ steps.changed-files.outputs.typst_any_changed }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          safe_output: false
          separator: "\n"
          files_yaml: |
            github_actions:
              - '.github/workflows/**'
              - '.github/actionlint-matcher.json'
            github_actions_ci:
              - '.github/workflows/ci.yaml'
            pre_commit_config:
              - '.pre-commit-config.yaml'
            renovate_config:
              - '.github/renovate.json5'
            md:
              - '**/*.md'
              - '.rumdl.toml'
            json5:
              - '**/*.json5'
            toml:
              - '**/*.toml'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '.yamllint.yaml'
            typst:
              - '**/*.typ'

  lint-github-actions:
    name: Lint GitHub Actions
    needs: determine-changes
    if: needs.determine-changes.outputs.github-actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          echo "::add-matcher::.github/actionlint-matcher.json"
          "$(go env GOPATH)/bin/actionlint" -color

  audit-zizmor:
    name: Audit with zizmor
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.github-actions == 'true'
      || needs.determine-changes.outputs.pre-commit-config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 'v1.30.1'
          advanced-security: false
          annotations: true

      - name: Audit with zizmor (SARIF upload)
        if: >-
          always()
          && github.event.repository.private == false
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 'v1.30.1'
          advanced-security: true

  validate-renovate-config:
    name: Validate Renovate config
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.renovate-config == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate Renovate config
        run: npx --package=renovate@44.132.2 --yes renovate-config-validator .github/renovate.json5

  lint-markdown:
    name: Lint Markdown
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.md == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: rvben/rumdl@9c4cc2a2ebe176de68e1788106e25af8a9bd3899 # v0.2.78
        with:
          version: '0.2.78'
          report-type: annotations

  validate-json5:
    name: Validate JSON5
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.json5 == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON5
        env:
          CHANGED_JSON5_FILES: ${{ needs.determine-changes.outputs.json5-files }}
        run: |
          readarray -t json5_files < <(
            printf '%s\n' "${CHANGED_JSON5_FILES}" | sed '/^$/d'
          )
          if [ ${#json5_files[@]} -eq 0 ]; then
            readarray -d '' -t json5_files < <(
              find . -type f -name '*.json5' -not -path './.git/*' -print0
            )
          fi
          if [ ${#json5_files[@]} -eq 0 ]; then
            echo 'No JSON5 files found.'
            exit 0
          fi
          exit_code=0
          for json5_file in "${json5_files[@]}"; do
            npx --yes json5@2.2.3 --validate "${json5_file}" || exit_code=1
          done
          exit ${exit_code}

  lint-toml:
    name: Lint TOML
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.toml == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@f6c2e810bb1ae4728d9269b7e354a3fd711a88ed # v1.7.2
        with:
          version: '1.7.2'

      - name: Lint TOML
        run: tombi lint --error-on-warnings --diagnostics-format=github

  format-toml:
    name: Format TOML
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.toml == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@f6c2e810bb1ae4728d9269b7e354a3fd711a88ed # v1.7.2
        with:
          version: '1.7.2'

      - name: Format TOML
        run: tombi format

      - name: Suggest TOML formatting
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: tombi-format
          cleanup: false

      - name: Check TOML formatting
        run: |
          git diff --name-only | while IFS= read -r file; do
            echo "::error file=${file},title=tombi-format::File is not formatted. Run tombi format."
          done
          git diff --exit-code

  lint-yaml:
    name: Lint YAML
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.yaml == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Lint YAML
        run: |
          git ls-files -z '*.yaml' '*.yml' \
            | xargs -0 -r uvx --from="yamllint==1.38.0" yamllint --format=github --strict

  run-prek-hooks:
    name: Run prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run prek hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 'v0.5.5'
          extra-args: --skip=no-commit-to-branch --all-files

  check-spelling:
    name: Check spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  format-typst:
    name: Format Typst
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.typst == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format Typst
        uses: typstyle-rs/typstyle-action@29e8697c27707b43f1dc08d3aba17868e14a1ce2 # v1.0.1

      - name: Suggest Typst formatting
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: typstyle
          cleanup: false

      - name: Check Typst formatting
        run: |
          git diff --name-only | while IFS= read -r file; do
            echo "::error file=${file},title=typstyle::File is not formatted. Run typstyle."
          done
          git diff --exit-code

  build-typst:
    name: Build Typst
    needs: determine-changes
    if: >-
      needs.determine-changes.outputs.typst == 'true'
      || needs.determine-changes.outputs.github-actions-ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        typst-version:
          - '^0.12.0'
          - '^0.13.0'
          - '^0.14.2'
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ matrix.typst-version }}

      - name: Show tool versions
        run: typst --version

      - name: Build Typst
        run: |
          for file in ${TYPST_TARGET_FILES}; do
            out="build/${file%.typ}.pdf"
            mkdir -p "$(dirname "${out}")"
            typst compile --root=. "${file}" "${out}"
          done

  lint-commit-messages:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Commitizen
        uses: commitizen-tools/setup-cz@96c75e6ae9632047f2c9b4025b9dd1624b40de8f # v0.9.1
        with:
          python-version: '3.x'
          version: '4.19.1'

      - name: Lint commit messages (push)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice title=cz check::Base commit unavailable (new branch or force push); skipping lint."
            exit 0
          fi
          cz check --rev-range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"

      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cz check --rev-range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
