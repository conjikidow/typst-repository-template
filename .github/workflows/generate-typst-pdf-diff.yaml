name: Generate Typst PDF diff

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**/*.typ'
      - '**/*.bib'
      - '**/*.csl'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
      - '.github/workflows/generate-typst-pdf-diff.yaml'
  workflow_dispatch:
    inputs:
      base-revision:
        description: 'Base revision to compare, as a branch, tag, or commit SHA'
        required: true
        default: main
      head-revision:
        description: 'Head revision to compare, as a branch, tag, or commit SHA (defaults to the dispatched ref)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  TYPST_TARGET_FILES: main.typ # Space-separated list of Typst entrypoint files

jobs:
  generate-typst-pdf-diff:
    name: Generate Typst PDF diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Generate Typst PDF diff
        uses: conjikidow/typst-pdf-diff-action@3d548627c8884fe5f0fa2b6aae0701c8f570f585 # v0.4.0
        with:
          target-files: ${{ env.TYPST_TARGET_FILES }}
          typst-version: '^0.14.2'
          base-revision: ${{ github.event_name == 'workflow_dispatch' && inputs.base-revision || '' }}
          head-revision: ${{ github.event_name == 'workflow_dispatch' && inputs.head-revision || '' }}
